<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>html_gpu_render motion demo</title>
<!--
  Fast, visible motion, to show (and measure) motion blur by sub-frames:  --subframes 16 --shutter 0.5
    - a white square that crosses the page at a constant 2400 CSS px per second, alone on its row, so the length
      of its streak can be measured:  streak = square width + speed * shutter / fps * (n - 1) / n
    - a bar turning once a second, a line of text sliding, and still text to compare against
  window.__seek(t) sets everything to time t; nothing else moves. ?still=1 freezes the page at t = 0.
-->
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; color: #e9e8e4; }
  .abs { position: absolute; }
  #square { left: 0; top: 80px; width: 40px; height: 40px; background: #ffffff; will-change: transform; }
  #slide { left: 0; top: 190px; font: 600 54px/1 'Segoe UI', sans-serif; white-space: nowrap; color: #ffd24a; will-change: transform; }
  #still { left: 120px; top: 300px; font: 400 30px/1.3 Georgia, serif; color: #cfd0d4; width: 700px; }
  #spinner { left: 1180px; top: 250px; width: 400px; height: 400px; }
  #arm { transform-origin: 200px 200px; }
  #orbit { left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; background: rgba(95, 176, 255, 0.85); will-change: transform; }
</style>
</head>
<body>
  <div id="square" class="abs"></div>
  <div id="slide" class="abs">Sliding text, 1200 px per second</div>
  <div id="still" class="abs">This text does not move: with any number of sub-frames it must come out exactly as sharp as without.</div>
  <svg id="spinner" class="abs" viewBox="0 0 400 400">
    <circle cx="200" cy="200" r="180" fill="none" stroke="#5fb0ff" stroke-width="2" stroke-opacity="0.6"/>
    <g id="arm"><rect x="200" y="194" width="170" height="12" rx="6" fill="#ff8a5c"/></g>
    <circle cx="200" cy="200" r="10" fill="#e9e8e4"/>
  </svg>
  <div id="orbit" class="abs"></div>

<script>
  const still = new URLSearchParams(location.search).get('still') === '1';
  const square = document.getElementById('square');
  const slide = document.getElementById('slide');
  const arm = document.getElementById('arm');
  const orbit = document.getElementById('orbit');

  // The seek hook: every position is a pure function of t (seconds).
  window.__seek = (time) => {
    const t = still ? 0 : time;
    // the square: 2400 CSS px per second from x = 200, wrapping after 1200 px
    square.style.transform = `translateX(${200 + ((t * 2400) % 1200)}px)`;
    // the text: 1200 px per second, back and forth over 600 px
    const u = (t * 2) % 2;
    slide.style.transform = `translateX(${120 + 600 * (u < 1 ? u : 2 - u)}px)`;
    // the bar: one turn per second; the small disc: two turns per second on a circle of radius 120
    arm.setAttribute('transform', `rotate(${(t * 360) % 360})`);
    const a = t * 4 * Math.PI;
    orbit.style.transform = `translate(${867 + 120 * Math.cos(a)}px, ${480 + 120 * Math.sin(a)}px)`;
  };
  window.__seek(0);
</script>
</body>
</html>
