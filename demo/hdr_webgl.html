<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>html_gpu_render HDR demo (WebGL2 float render target + hook)</title>
<!--
  The float hook, for a page that renders into a WebGL2 float framebuffer (a three.js WebGLRenderTarget of
  HalfFloatType or FloatType is one):

      window.__hgrFloatSource = () => ({ framebuffer, width, height });

  With --mode canvas and a float format the tool reads THAT framebuffer (readPixels FLOAT, in the same task as the
  draw) instead of the canvas, which only ever holds 8 bits.
  The picture is the same as in hdr_webgpu.html: five bands  v = 0.5, 1, 2, 4, 8,  upper half (v, v, v, 1), lower
  half (v, v / 2, v / 4, 1). The canvas itself shows the float picture clipped to 0..1.
-->
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
  const canvas = document.getElementById('stage');
  canvas.width = Math.round(innerWidth * devicePixelRatio);
  canvas.height = Math.round(innerHeight * devicePixelRatio);
  const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true });
  // rendering into float textures needs this extension
  if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('EXT_color_buffer_float is not available');

  // the float render target: RGBA16F, the size of the canvas
  const target = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, target);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, canvas.width, canvas.height);
  const framebuffer = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, target, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, `#version 300 es
    void main() { vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `#version 300 es
    precision highp float;
    uniform vec2 size;
    out vec4 colour;
    void main() {
      // gl_FragCoord has its origin at the bottom: the upper half of the picture is the larger y
      float k = min(4.0, floor(gl_FragCoord.x * 5.0 / size.x));
      float v = 0.5 * pow(2.0, k);
      vec3 c = vec3(v);
      if (gl_FragCoord.y < 0.5 * size.y) { c = vec3(v, v * 0.5, v * 0.25); }
      colour = vec4(c, 1.0);
    }`));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  const uSize = gl.getUniformLocation(program, 'size');

  // The seek hook: draws into the float target, then shows it (clipped) on the canvas.
  window.__seek = () => {
    gl.useProgram(program);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uSize, canvas.width, canvas.height);
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };

  // The float hook: which framebuffer holds the float picture, and its size.
  window.__hgrFloatSource = () => ({ framebuffer, width: canvas.width, height: canvas.height });
  window.__seek(0);
</script>
</body>
</html>
